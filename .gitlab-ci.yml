.texlive_matrix: &texlive_matrix
  parallel:
    matrix:
      - TEXLIVE:
          - '2023'
          - '2024'
          - '2025'

default:
  tags:
    - docker
  image: sergiud/texlive:$TEXLIVE

stages:
  - build
  - test

# Generating the library, building the documentation and the old page test run
# in one job, so that each TeX Live version uses only its own artifacts.
build:
  <<: *texlive_matrix
  stage: build
  script:
    - make generate
    - make doc
    - make test
  artifacts:
    paths:
      - "*.pdf"

check:
  <<: *texlive_matrix
  stage: test
  needs: []
  script:
    - l3build check
  artifacts:
    when: on_failure
    paths:
      - build/test/*.diff
      - build/test/*.log
