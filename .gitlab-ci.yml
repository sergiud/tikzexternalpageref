.texlive_matrix: &texlive_matrix
  parallel:
    matrix:
      - TEXLIVE:
          - '2023'
          - '2024'
          - '2025'

default:
  tags:
    - docker
  image: sergiud/texlive:$TEXLIVE

stages:
  - build
  - test

doc:
  <<: *texlive_matrix
  stage: build
  script:
    - l3build doc
  artifacts:
    paths:
      - "*.pdf"

check:
  <<: *texlive_matrix
  stage: test
  needs: []
  script:
    - l3build check
  artifacts:
    when: on_failure
    paths:
      - build/test/*.diff
      - build/test/*.log
